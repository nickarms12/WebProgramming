<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Coffee Order Form</title>
  </head>
  <body>
    
    <h1>Place Your Coffee Order Here Today!</h1>
    
    <p>Fill out your order to get your coffee faster!</p>

    <form action="https://www.w3schools.com/action_page.php" method="get">

        <label for="name">Customer Name:</label><br>
        <input type="text" id="name" name="customerName" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="coffee">Coffee Type:<label><br>
            <select id="coffee" name="coffeeType">
                <option value="latte">Latte</option>
                <option value="cappuccino">Cappuccino</option>
                <option value="americano">Americano</option>
                <option value="espresso">Espresso</option>
                <option value="iced_coffee">Iced Coffee</option>
                <option value="frappe">Frappe</option>
            </select><br><br>

            <p>Size:</p>
            <input type="radio" id="small" name="size" value="small">
            <label for="small">Small</label><br>

            <input type="radio" id="medium" name="size" value="medium">
            <label for="medium">Medium</label><br>

            <input type="radio" id="large" name="size" value="large">
            <label for="large">Large</label><br>

            <p>Extras:</p>
            <input type="checkbox" id="whipped" name="extras" value="whipped_cream">
            <label for="whipped">Whipped Cream</label><br>

            <input type="checkbox" id="shot" name="extras" value="extra_shot">
            <label for="shot">Extra Shot</label><br>

            <input type="checkbox" id="almond" name="extras" value="almond_milk">
            <label for="almond">Almond Milk</label><br>

            <input type="checkbox" id="sweetFoam" name="extras" value="sweet_foam">
            <label for="sweetFoam">Sweet Foam</label><br>

            <input type="checkbox" id="chocolate" name="extras" value="chocolate_shavings">
            <label for="chocolate">Chocolate Shavings</label><br><br>

            <label for="instructions">Special Instructions:</label><br>
            <textarea id="instructions" name="instructions" rows="4" cols="40"></textarea><br><br>

            <button type="submit">Submit Order and Start Your Morning!</button>
    </form>

  </body>
</html>
