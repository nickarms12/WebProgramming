<!DOCTYPE html>
<html lang="en">
<head>

<title>CSS Box Model Lab</title>
<style>
/* Add your CSS here */

body {
    font-family: sans-serif;
}

.box {
    border: 5px solid blue;
    padding: 20px;
    margin: 20px;
    background-color: lightgray;

    width: 200px;
    height: 200px;

    box-sizing: border-box;
}
</style>
</head>

<body>

    <h1>CSS Box Model Lab</h1>

    <div class="box">

        <p>This is a demonstration of the CSS Box Model.</p>

    </div>

    <div class="box">
        
        <p>This is another box to show the margin spacing between elements.</p>
    
    </div>

</body>
